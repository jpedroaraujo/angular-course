<div class="top-menu">
    <img class="logo"
         src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">
</div>

<div class="courses">
  @for (course of courses; track course.id) {
    <course-card (courseSelected)="courseSelected($event)" [course]="course" />
  }
  @empty {
    <div class="empty">
      <h2>Sorry, no courses found</h2>
      <img src="https://angular-academy.s3.amazonaws.com/main-logo/main-page-logo-small-hat.png">
    </div>
  }
</div>
